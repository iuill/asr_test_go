name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify frontend
        run: npm run build --prefix frontend
      - name: Test frontend
        run: npm test --prefix frontend
      - name: Test Go
        run: go test ./...
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $version = '0.0.1'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          wails build -platform windows/amd64 -skipbindings -webview2 error -o asr_test_go.exe -ldflags "-X main.appVersion=$version"
      - name: Package EXE and configuration template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/asr_test_go -Force | Out-Null
          Copy-Item build/bin/asr_test_go.exe release/asr_test_go/
          Copy-Item appsettings.example.json release/asr_test_go/appsettings.json
          Copy-Item README.md release/asr_test_go/
          Compress-Archive -Path release/asr_test_go -DestinationPath release/asr_test_go-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: asr_test_go-windows-x64
          path: release/asr_test_go-windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/asr_test_go.exe
            release/asr_test_go-windows-x64.zip
          generate_release_notes: true
